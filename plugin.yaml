name: recall
version: 0.2.1
manifest_version: 2
api_version: 1
description: >-
  Local file recall for Hermes: a private, on-device index of the documents on your
  machine (SQLite FTS5, standard library extraction, no network and no embedding service),
  a @recall: context reference that pulls the right file into the prompt, and a
  pre_llm_call hint that surfaces candidate files before the model answers — so "where is
  that Acme invoice" is answered from the real file instead of a guess. Five tools
  (index/search/open/stats/forget), a bounded background refresh on session start, and a
  read policy applied to the resolved path that refuses credential stores, Hermes' own home
  directory (~/.hermes: vault, sessions, MCP tokens, the index itself) and virtual
  filesystems before any file is opened.
author: memeshee
license: MIT
homepage: https://github.com/memeshee/hermes-recall
tags: [files, search, index, local-first, context, documents]
requires_hermes: ">=0.19"
provides_tools:
  - recall_index
  - recall_search
  - recall_open
  - recall_stats
  - recall_forget
provides_hooks:
  - pre_llm_call
  - on_session_start
config_schema:
  roots:
    type: list
    description: "Folders to index. Defaults to ~/Documents only; ~/Downloads, ~/Desktop and ~/Projects are indexed only when named here. Any folder inside Hermes' own home is refused."
  excludes:
    type: list
    description: "Extra glob patterns to skip, on top of the built-in secret, agent-state and build-directory denylist."
  ambient:
    type: bool
    default: true
    description: "Let the pre_llm_call hook surface candidate files when a message looks like it is about a document."
  max_hints:
    type: int
    default: 3
    description: "Maximum candidate files injected per turn."
  max_file_mb:
    type: int
    default: 8
    description: "Skip files larger than this many megabytes."
  chunk_chars:
    type: int
    default: 1200
    description: "Characters per indexed chunk."
  max_files:
    type: int
    default: 20000
    description: "Hard cap on files touched by one index run."
  budget_s:
    type: int
    default: 90
    description: "Wall-clock budget for one index run before it returns partial progress."
  refresh_on_start:
    type: bool
    default: true
    description: "Once an index exists, refresh it in the background when a session starts, so a file saved yesterday is findable today."
  refresh_budget_s:
    type: int
    default: 25
    description: "Wall-clock budget for one background refresh."
  refresh_max_files:
    type: int
    default: 5000
    description: "Max files a background refresh inspects."
